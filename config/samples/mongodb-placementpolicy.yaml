# MongoDB, two data Members plus a vote-only Arbiter third site, group failover scope.
# The Arbiter DC holds the dr-controlplane etcd member plus a data-less MongoDB arbiter
# that the operator places onto that spoke: it votes (so the replica set keeps an odd,
# partition-safe member count) but carries no data and is never elected primary. It is
# not a data-bearing member. It follows its own primary-dc-orders Lease, independent of
# other groups.
apiVersion: apps.k8s.appscode.com/v1
kind: PlacementPolicy
metadata:
  name: mongodb-orders-geo
spec:
  clusterSpreadConstraint:
    slice:
      projectNamespace: kubeslice-project
      sliceName: kubedb-geo
    failoverPolicy:
      mode: TwoDC
      trigger:
        scope: Group
        group: orders
    distributionRules:
      - clusterName: dc-a
        replicaIndices: [0, 1]
        role: Member
      - clusterName: dc-b
        replicaIndices: [2, 3]
        role: Member
      - clusterName: dc-c
        replicaIndices: []
        role: Arbiter
