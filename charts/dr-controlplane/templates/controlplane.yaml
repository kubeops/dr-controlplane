{{- if .Values.controlplane.enabled }}
{{- $ns := .Values.namespace -}}
{{- $name := printf "%s-controlplane" (include "dr.fullname" .) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "dr.labels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "dr.labels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
rules:
  # The control plane writes its generated client kubeconfigs into Secrets in its
  # own namespace, and reads/updates ConfigMaps during bootstrap.
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "dr.labels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $ns }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "dr.labels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
data:
  # The OCM control plane reads ocmconfig.yaml from --controlplane-config-dir.
  # External etcd mode (not the embedded single node), pointed at the 3 DC quorum.
  ocmconfig.yaml: |
    dataDirectory: /.ocm
    apiserver:
      externalHostname: {{ .Values.controlplane.externalHostname }}
      port: {{ .Values.controlplane.port }}
      {{- if .Values.controlplane.apiserverCASecret }}
      caFile: /controlplane_ca/ca.crt
      caKeyFile: /controlplane_ca/ca.key
      {{- end }}
    etcd:
      mode: external
      prefix: {{ .Values.controlplane.etcdPrefix }}
      servers:
      {{- range (include "dr.etcdEndpoints" . | splitList ",") }}
        - {{ . }}
      {{- end }}
      {{- if .Values.controlplane.etcdTLSSecret }}
      caFile: /etc/etcd-tls/ca.crt
      certFile: /etc/etcd-tls/tls.crt
      keyFile: /etc/etcd-tls/tls.key
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "dr.labels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
spec:
  replicas: {{ .Values.controlplane.replicas }}
  {{- if .Values.controlplane.persistence.enabled }}
  # The data dir is on a ReadWriteOnce PVC, so the old pod must release the volume
  # before the replacement attaches it. RollingUpdate would deadlock on the single
  # attach PVC, so force Recreate. Keep controlplane.replicas at 1 when persisting.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dr.name" . }}
      app.kubernetes.io/component: controlplane
  template:
    metadata:
      annotations:
        checksum/config: {{ tpl (.Files.Get "templates/controlplane.yaml") . | sha256sum }}
      labels:
        {{- include "dr.labels" . | nindent 8 }}
        app.kubernetes.io/component: controlplane
    spec:
      serviceAccountName: {{ $name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controlplane
          image: {{ required "controlplane.image is required when controlplane.enabled is true" .Values.controlplane.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{ .Values.controlplane.command | default (list "/multicluster-controlplane") | toJson }}
          args:
            - server
            - --controlplane-config-dir=/controlplane_config
          ports:
            - name: https
              containerPort: {{ .Values.controlplane.port }}
          volumeMounts:
            - name: data
              mountPath: /.ocm
            - name: config
              mountPath: /controlplane_config
              readOnly: true
            {{- if .Values.controlplane.etcdTLSSecret }}
            - name: etcd-tls
              mountPath: /etc/etcd-tls
              readOnly: true
            {{- end }}
            {{- if .Values.controlplane.apiserverCASecret }}
            - name: apiserver-ca
              mountPath: /controlplane_ca
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.controlplane.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: config
          configMap:
            name: {{ $name }}
        {{- if .Values.controlplane.etcdTLSSecret }}
        - name: etcd-tls
          secret:
            secretName: {{ .Values.controlplane.etcdTLSSecret }}
        {{- end }}
        {{- if .Values.controlplane.apiserverCASecret }}
        - name: apiserver-ca
          secret:
            secretName: {{ .Values.controlplane.apiserverCASecret }}
        {{- end }}
{{- if .Values.controlplane.persistence.enabled }}
---
# Durable home for the apiserver data dir (/.ocm) so the self minted server-ca,
# client-ca, request-header-ca, and issued certs survive a pod restart. On first
# boot the PVC is empty and the apiserver generates the CAs into it; every restart
# after that reuses them, so a pod loss no longer breaks cross DC TLS trust.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  namespace: {{ $ns }}
  labels:
    {{- include "dr.labels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
spec:
  accessModes:
    - {{ .Values.controlplane.persistence.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ .Values.controlplane.persistence.size | default "1Gi" }}
  {{- if .Values.controlplane.persistence.storageClassName }}
  storageClassName: {{ .Values.controlplane.persistence.storageClassName | quote }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "dr.labels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
spec:
  # The single front endpoint clients name in their kubeconfig. Set type to
  # LoadBalancer (or front it with a GSLB) to expose it across data centers.
  type: {{ .Values.controlplane.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "dr.name" . }}
    app.kubernetes.io/component: controlplane
  ports:
    - name: https
      port: {{ .Values.controlplane.port }}
      targetPort: https
{{- end }}
